site_name: IoT Book
site_description: Translated IoT technical book
site_author: Translation Pipeline

docs_dir: en-md
site_dir: en
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - attr_list
  - pymdownx.magiclink

copyright: © Tsinghua University - Jiliang Wang - jiliangwang@tsinghua.edu.cn

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  alternate:
    - name: 中文
      link: /zh/
      lang: zh

plugins:
  - search


